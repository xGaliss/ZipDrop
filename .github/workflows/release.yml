name: Release

# Push a tag like v0.1.0 to build and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Version from tag
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test
        run: dotnet test -c Release

      - name: Publish framework-dependent
        run: dotnet publish src/ZipDrop -c Release -r win-x64 --self-contained false -p:PublishReadyToRun=true -p:DebugType=none -p:Version=${{ env.VERSION }} -o out/fd

      - name: Publish portable (self-contained single file)
        run: dotnet publish src/ZipDrop -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=true -p:DebugType=none -p:Version=${{ env.VERSION }} -o out/portable

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" "/DPublishDir=$PWD\out\portable" installer\ZipDrop.iss

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive out/portable/* "dist/ZipDrop-$env:VERSION-win-x64-portable.zip"
          Compress-Archive out/fd/* "dist/ZipDrop-$env:VERSION-win-x64-framework-dependent.zip"
          Copy-Item "artifacts/installer/ZipDrop-Setup-$env:VERSION.exe" dist/
          Get-ChildItem dist | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name } | Out-File dist/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
